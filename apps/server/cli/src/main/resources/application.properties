quarkus.banner.enabled=false
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ECA_ALLOWED_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,X-Correlation-ID
quarkus.http.cors.exposed-headers=X-Correlation-ID
quarkus.http.cors.access-control-allow-credentials=false
quarkus.log.level=${ECA_LOG_LEVEL:INFO}

eca.max-request-bytes=${ECA_MAX_REQUEST_BYTES:1048576}
eca.max-json-depth=${ECA_MAX_JSON_DEPTH:32}
eca.max-string-length=${ECA_MAX_STRING_LENGTH:16384}
eca.max-parameters=${ECA_MAX_PARAMETERS:10000}
eca.max-payloads=${ECA_MAX_PAYLOADS:10000}
eca.max-events=${ECA_MAX_EVENTS:10000}
eca.max-conditions=${ECA_MAX_CONDITIONS:100000}
eca.max-actions=${ECA_MAX_ACTIONS:10000}
eca.max-rules=${ECA_MAX_RULES:100000}
eca.max-payload-values=${ECA_MAX_PAYLOAD_VALUES:256}
eca.trace-enabled=${ECA_TRACE_ENABLED:true}
eca.allowed-origins=${ECA_ALLOWED_ORIGINS:http://localhost:5173}
